[project]
name = "bad-guesser"
version = "0.1.0"
description = "Speculative decoding's acceptance rule run millions of times on a B200 against Qwen3-8B's real next-token distributions: drafters of every quality give the target's histogram while the acceptance rate spans the range, four plausible wrong rules do not, the bf16 output head is the only numerics gap, and vLLM's own rejection sampler and its n-gram serving path agree."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gpu = []  # the GPU run uses a python with torch 2.13 cu130, transformers 5.17 and vLLM 0.31, and Qwen/Qwen3-8B in the Hugging Face cache; nothing is downloaded

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bad_guesser"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
