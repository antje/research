[project]
name = "decode-roofline"
version = "0.1.0"
description = "Roofline arithmetic for one LLM decode step: bytes, FLOPs, arithmetic intensity, ridge points, and what fits on chip."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gpu = ["torch"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
